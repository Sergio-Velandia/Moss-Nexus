<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Moss Nexus: plantillas de automatización para n8n, ya armadas, explicadas y listas para copiar." />
    <meta name="theme-color" content="#0e130e" />
    <title>Moss Nexus · Plantillas de n8n listas para copiar</title>
    <link rel="canonical" href="https://sergio-velandia.dev/Moss-Nexus/" />
    <!-- Vista previa al compartir el enlace. La imagen (1200×630) vive en public/og.png -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moss Nexus" />
    <meta property="og:locale" content="es_LA" />
    <meta property="og:title" content="Moss Nexus · Plantillas de n8n listas para copiar" />
    <meta property="og:description" content="Moss Nexus: plantillas de automatización para n8n, ya armadas, explicadas y listas para copiar." />
    <meta property="og:url" content="https://sergio-velandia.dev/Moss-Nexus/" />
    <meta property="og:image" content="https://sergio-velandia.dev/Moss-Nexus/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Moss Nexus: del problema al flujo de n8n en minutos" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moss Nexus · Plantillas de n8n listas para copiar" />
    <meta name="twitter:description" content="Moss Nexus: plantillas de automatización para n8n, ya armadas, explicadas y listas para copiar." />
    <meta name="twitter:image" content="https://sergio-velandia.dev/Moss-Nexus/og.png" />
    <!-- Nexus es oscuro por defecto; solo cambia si la persona eligió el tema claro a mano -->
    <script>
      try {
        if (localStorage.getItem('nexus-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf7ef')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <template id="plantilla-entrada">
      <div class="entrada" aria-hidden="true">
        <span class="entrada-vapor"></span>
        <span class="entrada-vapor"></span>
        <span class="entrada-vapor"></span>
        <div class="entrada-centro">
          <div class="entrada-marca">
            <div class="entrada-granos"></div>
            <svg class="entrada-silueta" viewBox="0 0 64 64">
              <path d="M20 22c10 0 12 20 24 20" fill="none" stroke="var(--c-entrada-coral)" stroke-width="4" stroke-linecap="round" />
              <rect x="9" y="13" width="18" height="18" rx="6" fill="var(--c-entrada-musgo)" />
              <rect x="37" y="33" width="18" height="18" rx="6" fill="var(--c-entrada-coral)" />
            </svg>
          </div>
          <div class="entrada-nombre">
            <span class="entrada-palabra"><span class="entrada-nitida">Moss</span><span class="entrada-difusa">Moss</span></span>
            <span class="entrada-palabra"><span class="entrada-nitida">Nexus</span><span class="entrada-difusa">Nexus</span></span>
          </div>
          <span class="entrada-linea"></span>
          <span class="entrada-lema">Del problema al flujo en minutos</span>
        </div>
      </div>
    </template>
    <script>
      // Pantalla de entrada: solo al llegar de afuera, sin guardar nada. Ni al recargar ni con movimiento reducido.
      (function () {
        try {
          var nav = performance.getEntriesByType("navigation")[0];
          if (nav && nav.type !== "navigate") return;
          if (document.referrer.indexOf(location.origin + "%BASE_URL%") === 0) return;
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

          var entrada = document.getElementById("plantilla-entrada").content.firstElementChild.cloneNode(true);
          var granos = entrada.querySelector(".entrada-granos");
          var grano = function (x, y, angulo, i) {
            var g = document.createElement("span");
            var lejos = 40 + (i % 5) * 9;
            g.className = "entrada-grano";
            g.style.cssText =
              "--x:" + (x - 32) * 2 + "px;--y:" + (y - 32) * 2 + "px;--d:" + (i % 7) * 40 + "ms;" +
              "--sx:" + Math.cos(angulo) * lejos + "vmax;--sy:" + Math.sin(angulo) * lejos + "vmax";
            granos.appendChild(g);
          };
          // Los dos cuadros del favicon, rellenos con una rejilla; luego la curva que los une.
          for (var i = 0; i < 25; i++) {
            var cx = ((i % 5) + 0.5) * 3.6;
            var cy = (Math.floor(i / 5) + 0.5) * 3.6;
            grano(9 + cx, 13 + cy, i * 2.39996, i);
            grano(37 + cx, 33 + cy, (i + 25) * 2.39996, i + 25);
          }
          for (var k = 0; k < 20; k++) {
            var t = (k + 0.5) / 20;
            var u = 1 - t;
            grano(
              u * u * u * 20 + 3 * u * u * t * 30 + 3 * u * t * t * 32 + t * t * t * 44,
              u * u * u * 22 + 3 * u * u * t * 22 + 3 * u * t * t * 42 + t * t * t * 42,
              (k + 50) * 2.39996,
              k
            );
          }

          var color = document.querySelector("meta[name=theme-color]");
          var colorAntes = color.getAttribute("content");
          var quitar = function () {
            entrada.remove();
            color.setAttribute("content", colorAntes);
            removeEventListener("pointerdown", quitar);
            removeEventListener("keydown", quitar);
          };
          entrada.addEventListener("animationend", function (e) {
            if (e.target === entrada) quitar();
          });
          addEventListener("pointerdown", quitar);
          addEventListener("keydown", quitar);
          setTimeout(quitar, 3000);
          color.setAttribute("content", "#0e130e");
          document.body.prepend(entrada);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <noscript><p style="padding:1rem;font-family:system-ui,sans-serif">Moss Nexus necesita JavaScript activado para funcionar.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
