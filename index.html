<html lang="es" data-theme="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Moss Nexus: plantillas de automatización para n8n, ya armadas, explicadas y listas para copiar." />

    <link rel="canonical" href="https://sergio-velandia.github.io/Moss-Nexus/" />
    <!-- Vista previa al compartir el enlace. La imagen (1200×630) vive en public/og.png -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moss Nexus" />
    <meta property="og:locale" content="es_LA" />
    <meta property="og:title" content="Moss Nexus · Plantillas de n8n listas para copiar" />
    <meta property="og:description" content="Moss Nexus: plantillas de automatización para n8n, ya armadas, explicadas y listas para copiar." />

    <!-- Nexus es oscuro por defecto; solo cambia si la persona eligió el tema claro a mano -->
    <script>
      try {
        if (localStorage.getItem('nexus-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf7ef')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:1rem;font-family:system-ui,sans-serif">Moss Nexus necesita JavaScript activado para funcionar.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
